# Reverse proxy configuration
# Routes incoming requests to the appropriate backend service

# Define upstream (backend) servers
# Requests to /api/* will be forwarded to these servers
upstream api {
    server api:8080;  # Service name "api" resolves via Docker DNS to container IP
}

# HTTP server - redirects all requests to HTTPS
server {
    listen 80;              # Listen on port 80 (HTTP)
    server_name localhost;  # Domain name

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server - main entry point
server {
    listen 443 ssl http2;   # Listen on 443 (HTTPS) with SSL and HTTP/2
    server_name localhost;   # Domain name

    # SSL/TLS configuration
    ssl_certificate /etc/nginx/certs/server.crt;      # SSL certificate
    ssl_certificate_key /etc/nginx/certs/server.key;  # Private key
    ssl_protocols TLSv1.2 TLSv1.3;   # Only allow TLS 1.2 and 1.3
    ssl_ciphers HIGH:!aNULL:!MD5;     # Strong ciphers only
    ssl_prefer_server_ciphers on;     # Server cipher preference

    # Request size limits - prevents DoS attacks
    client_max_body_size 10M;   # Max request body size (10MB)
    client_body_timeout 15s;     # Max time to read request body
    client_header_timeout 15s;    # Max time to read request headers

    # Root route - serves React frontend
    location / {
        proxy_pass http://api;  # Forward to Go API (serves static files too)

        # HTTP/1.1 support for proxying
        proxy_http_version 1.1;

        # Pass original client information to backend
        proxy_set_header Host $host;              # Original host
        proxy_set_header X-Real-IP $remote_addr;  # Client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Original IP chain
        proxy_set_header X-Forwarded-Proto $scheme;  # Original protocol (http/https)

        # Disable caching for dynamic content
        proxy_cache off;
        proxy_buffering off;

        # Timeouts for proxy operations
        proxy_connect_timeout 15s;   # Max time to connect to backend
        proxy_send_timeout 30s;      # Max time to send request to backend
        proxy_read_timeout 30s;      # Max time to receive response from backend
    }

    # Security headers - protect against common attacks
    add_header X-Content-Type-Options "nosniff" always;    # Prevent MIME type sniffing
    add_header X-Frame-Options "DENY" always;              # Prevent clickjacking
    add_header X-XSS-Protection "1; mode=block" always;    # XSS filter
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # Privacy
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HSTS
}
