# nginx main configuration
# This file configures the nginx reverse proxy server

worker_processes auto;  # Use all available CPU cores
error_log /var/log/nginx/error.log warn;  # Error log location
pid /var/run/nginx.pid;  # Process ID file

# Event processing configuration
events {
    worker_connections 2048;  # Max concurrent connections per worker
    use epoll;                # Linux-optimized event processing
    multi_accept on;          # Accept multiple connections at once
}

http {
    # Include mime types for file type detection
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format: includes client IP, request, status, bytes, user agent
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Access log location
    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;           # Use sendfile() for file serving
    tcp_nopush on;         # Optimize TCP packet sending
    tcp_nodelay on;        # Disable Nagle's algorithm
    keepalive_timeout 65;  # Keep connections alive
    types_hash_max_size 2048;  # Speed up MIME type lookup
    server_tokens off;     # Hide nginx version in responses

    # Enable Gzip compression (reduces file sizes by ~70%)
    gzip on;
    gzip_vary on;              # Tell clients response is gzipped
    gzip_proxied any;          # Compress proxied responses
    gzip_comp_level 6;        # Compression level (1-9)
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";      # Don't compress for old IE

    # Load additional server configurations
    include /etc/nginx/conf.d/*.conf;
}
